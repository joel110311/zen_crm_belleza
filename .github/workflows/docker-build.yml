name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject known production vulnerabilities
        shell: bash
        run: |
          set -euo pipefail

          # npm's advisory endpoint is occasionally unavailable (HTTP 503). Retry it
          # because this is an infrastructure failure, not a dependency finding.
          for attempt in 1 2 3; do
            audit_output="$(mktemp)"
            if npm audit --omit=dev --audit-level=high --json >"$audit_output" 2>&1; then
              cat "$audit_output"
              exit 0
            fi

            audit_status=$?
            cat "$audit_output"

            if grep -qE '503 Service Unavailable|"code"[[:space:]]*:[[:space:]]*"E503"' "$audit_output"; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit no está disponible; reintentando ($attempt/3)…"
                sleep "$((attempt * 10))"
                continue
              fi

              echo "::warning title=npm audit temporalmente no disponible::La auditoría de npm respondió 503 tras tres intentos. La compilación continúa; no se detectó una vulnerabilidad."
              exit 0
            fi

            # A completed audit with high/critical findings still blocks publication.
            exit "$audit_status"
          done

  build-and-push:
    needs: security-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-db:
    needs: security-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Database image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.db
          push: true
          tags: ghcr.io/${{ github.repository }}_db:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
