name: zen-crm-oftalmo

services:
  zen-crm:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://zencrm:${LOCAL_POSTGRES_PASSWORD:?Define LOCAL_POSTGRES_PASSWORD}@zen-crm-db:5432/zencrm
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOW_ENV_AI_FALLBACK=${ALLOW_ENV_AI_FALLBACK:-true}
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:8080
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:?Define WUZAPI_ADMIN_TOKEN}
      - WUZAPI_USER_TOKEN=${WUZAPI_USER_TOKEN:?Define WUZAPI_USER_TOKEN}
      - BOT_MESSAGE_SECRET=${BOT_MESSAGE_SECRET:-}
      - WHATSAPP_INSTANCE_NAME=${WHATSAPP_INSTANCE_NAME:-zen-crm-oftalmo-local}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY:?Define WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_GLOBAL_HMAC_KEY:?Define WUZAPI_GLOBAL_HMAC_KEY}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-superadmin@zencrm.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Define INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Super Admin}
      - AUTH_SECRET=${AUTH_SECRET:?Define AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      - PUBLIC_SUPPORT_EMAIL=${PUBLIC_SUPPORT_EMAIL:-}
      - AUTH_URL=${AUTH_URL:-http://localhost:3008}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3008}
      # Disabled by default: the legacy local database remains available while the
      # platform uses a separate control plane and one DB per tenant.
      - CONTROL_DATABASE_URL=postgresql://${CONTROL_POSTGRES_USER:-zencrm_control_runtime}:${CONTROL_POSTGRES_PASSWORD:-local-control-runtime-password}@zen-crm-db:5432/${CONTROL_POSTGRES_DB:-zencrm_control}
      - MULTITENANT_RUNTIME_ENABLED=${MULTITENANT_RUNTIME_ENABLED:-false}
      - MULTITENANT_AUTH_ENABLED=${MULTITENANT_AUTH_ENABLED:-false}
      - MULTITENANT_PUBLIC_SIGNUP_ENABLED=${MULTITENANT_PUBLIC_SIGNUP_ENABLED:-false}
      - MULTITENANT_INVITATIONS_ENABLED=${MULTITENANT_INVITATIONS_ENABLED:-false}
      - MULTITENANT_PUBLIC_PORTAL_ENABLED=${MULTITENANT_PUBLIC_PORTAL_ENABLED:-false}
      - MULTITENANT_CHANNELS_ENABLED=${MULTITENANT_CHANNELS_ENABLED:-false}
      - MULTITENANT_PRIVATE_STORAGE_ENABLED=${MULTITENANT_PRIVATE_STORAGE_ENABLED:-false}
      - SECURITY_HASH_SALT=${SECURITY_HASH_SALT:-}
      - TENANT_CREDENTIALS_ENCRYPTION_KEY=${TENANT_CREDENTIALS_ENCRYPTION_KEY:-}
      - TENANT_CREDENTIALS_KEY_VERSION=${TENANT_CREDENTIALS_KEY_VERSION:-1}
      - WHATSAPP_WEBHOOK_BASE_URL=${WHATSAPP_WEBHOOK_BASE_URL:-http://host.docker.internal:3008}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_EMBEDDED_SIGNUP_CONFIG_ID=${META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      - META_TECH_PROVIDER_SOLUTION_ID=${META_TECH_PROVIDER_SOLUTION_ID:-}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - META_WHATSAPP_REGISTRATION_PIN=${META_WHATSAPP_REGISTRATION_PIN:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - META_WEBHOOK_BASE_URL=${META_WEBHOOK_BASE_URL:-http://localhost:3008}
      - CHANNEL_STATE_SIGNING_SECRET=${CHANNEL_STATE_SIGNING_SECRET:-}
      - MULTITENANT_WUZAPI_BASE_URL=${MULTITENANT_WUZAPI_BASE_URL:-}
      - MULTITENANT_WUZAPI_WEBHOOK_HMAC_KEY=${MULTITENANT_WUZAPI_WEBHOOK_HMAC_KEY:-}
      - TENANT_STORAGE_S3_ENDPOINT=${TENANT_STORAGE_S3_ENDPOINT:-}
      - TENANT_STORAGE_S3_REGION=${TENANT_STORAGE_S3_REGION:-us-east-1}
      - TENANT_STORAGE_S3_BUCKET=${TENANT_STORAGE_S3_BUCKET:-}
      - TENANT_STORAGE_S3_ACCESS_KEY_ID=${TENANT_STORAGE_S3_ACCESS_KEY_ID:-}
      - TENANT_STORAGE_S3_SECRET_ACCESS_KEY=${TENANT_STORAGE_S3_SECRET_ACCESS_KEY:-}
      - TENANT_STORAGE_S3_SESSION_TOKEN=${TENANT_STORAGE_S3_SESSION_TOKEN:-}
      - TENANT_STORAGE_S3_FORCE_PATH_STYLE=${TENANT_STORAGE_S3_FORCE_PATH_STYLE:-true}
      - TENANT_STORAGE_REQUIRE_ANTIVIRUS=${TENANT_STORAGE_REQUIRE_ANTIVIRUS:-false}
      - TENANT_STORAGE_MAX_UPLOAD_BYTES=${TENANT_STORAGE_MAX_UPLOAD_BYTES:-26214400}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=${TZ:-America/Mexico_City}
    ports:
      - "3008:3000"
      - "8008:3000"
    volumes:
      - zen_crm_uploads:/app/public/uploads
    depends_on:
      zen-crm-db:
        condition: service_healthy
        restart: true
      whatsapp-gateway:
        condition: service_started
        restart: true
    networks:
      - zen-crm-local
    restart: unless-stopped

  # Start explicitly with: docker compose --profile multitenant up provisioner
  # The admin URL is deliberately absent from the web service.
  provisioner:
    build:
      context: .
      dockerfile: Dockerfile
      target: provisioner
    profiles: ["multitenant"]
    command: ["sh", "-c", "node migrate-control-plane.mjs && while true; do node provision-tenant.mjs --drain || true; sleep ${PROVISIONER_POLL_SECONDS:-15}; done"]
    environment:
      - CONTROL_DATABASE_URL=postgresql://${CONTROL_POSTGRES_USER:-zencrm_control_runtime}:${CONTROL_POSTGRES_PASSWORD:-local-control-runtime-password}@zen-crm-db:5432/${CONTROL_POSTGRES_DB:-zencrm_control}
      - TENANT_POSTGRES_ADMIN_URL=postgresql://zencrm:${LOCAL_POSTGRES_PASSWORD:?Define LOCAL_POSTGRES_PASSWORD}@zen-crm-db:5432/postgres
      - CONTROL_DATABASE_REQUIRE_LEAST_PRIVILEGE=${CONTROL_DATABASE_REQUIRE_LEAST_PRIVILEGE:-true}
      - TENANT_POSTGRES_CLUSTER_KEY=${TENANT_POSTGRES_CLUSTER_KEY:-local}
      - TENANT_CREDENTIALS_ENCRYPTION_KEY=${TENANT_CREDENTIALS_ENCRYPTION_KEY:-}
      - TENANT_CREDENTIALS_KEY_VERSION=${TENANT_CREDENTIALS_KEY_VERSION:-1}
      - TENANT_TRIAL_DAYS=${TENANT_TRIAL_DAYS:-7}
      - PROVISIONER_POLL_SECONDS=${PROVISIONER_POLL_SECONDS:-15}
      - TZ=${TZ:-America/Mexico_City}
    depends_on:
      zen-crm-db:
        condition: service_healthy
    networks:
      - zen-crm-local
    restart: unless-stopped

  # Receives no DATABASE_URL and mounts no public upload folder. Scale this service freely:
  # PostgreSQL SKIP LOCKED plus per-message advisory locks make every work item idempotent.
  tenant-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: tenant-worker
    profiles: ["multitenant"]
    command: ["sh", "-c", "while true; do node tenant-work-worker.mjs --drain || true; sleep ${TENANT_WORKER_POLL_SECONDS:-10}; done"]
    environment:
      - CONTROL_DATABASE_URL=postgresql://${CONTROL_POSTGRES_USER:-zencrm_control_runtime}:${CONTROL_POSTGRES_PASSWORD:-local-control-runtime-password}@zen-crm-db:5432/${CONTROL_POSTGRES_DB:-zencrm_control}
      - TENANT_CREDENTIALS_ENCRYPTION_KEY=${TENANT_CREDENTIALS_ENCRYPTION_KEY:-}
      - TENANT_CREDENTIALS_KEY_VERSION=${TENANT_CREDENTIALS_KEY_VERSION:-1}
      - TENANT_WORKER_POLL_SECONDS=${TENANT_WORKER_POLL_SECONDS:-10}
      - TENANT_WORKER_STALE_SECONDS=${TENANT_WORKER_STALE_SECONDS:-300}
      - TENANT_WORKER_MAX_DRAIN=${TENANT_WORKER_MAX_DRAIN:-100}
      - TENANT_STORAGE_S3_ENDPOINT=${TENANT_STORAGE_S3_ENDPOINT:-}
      - TENANT_STORAGE_S3_REGION=${TENANT_STORAGE_S3_REGION:-us-east-1}
      - TENANT_STORAGE_S3_BUCKET=${TENANT_STORAGE_S3_BUCKET:-}
      - TENANT_STORAGE_S3_ACCESS_KEY_ID=${TENANT_STORAGE_S3_ACCESS_KEY_ID:-}
      - TENANT_STORAGE_S3_SECRET_ACCESS_KEY=${TENANT_STORAGE_S3_SECRET_ACCESS_KEY:-}
      - TENANT_STORAGE_S3_SESSION_TOKEN=${TENANT_STORAGE_S3_SESSION_TOKEN:-}
      - TENANT_STORAGE_S3_FORCE_PATH_STYLE=${TENANT_STORAGE_S3_FORCE_PATH_STYLE:-true}
      - TZ=${TZ:-America/Mexico_City}
    depends_on:
      zen-crm-db:
        condition: service_healthy
    networks:
      - zen-crm-local
    restart: unless-stopped

  whatsapp-gateway:
    image: asternic/wuzapi:sha-9487eca
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:?Define WUZAPI_ADMIN_TOKEN}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY:?Define WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_GLOBAL_HMAC_KEY:?Define WUZAPI_GLOBAL_HMAC_KEY}
      - DB_USER=wuzapi
      - DB_PASSWORD=${WUZAPI_DB_PASSWORD:?Define WUZAPI_DB_PASSWORD}
      - DB_NAME=wuzapi
      - DB_HOST=whatsapp-db
      - DB_PORT=5432
      - DB_SSLMODE=false
      - WEBHOOK_FORMAT=json
      - SESSION_DEVICE_NAME=${SESSION_DEVICE_NAME:-Zen CRM Oftalmo Local}
      - TZ=${TZ:-America/Mexico_City}
    ports:
      - "8086:8080"
    depends_on:
      whatsapp-db:
        condition: service_healthy
        restart: true
    networks:
      - zen-crm-local
    restart: unless-stopped

  whatsapp-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=wuzapi
      - POSTGRES_PASSWORD=${WUZAPI_DB_PASSWORD:?Define WUZAPI_DB_PASSWORD}
      - POSTGRES_DB=wuzapi
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - wuzapi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzapi -d wuzapi"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - zen-crm-local
    restart: unless-stopped

  zen-crm-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: ghcr.io/joel110311/zen_crm_oftalmo_db:latest
    environment:
      - POSTGRES_USER=zencrm
      - POSTGRES_PASSWORD=${LOCAL_POSTGRES_PASSWORD:?Define LOCAL_POSTGRES_PASSWORD}
      - POSTGRES_DB=zencrm
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - zen_crm_db_data:/var/lib/postgresql/data
    ports:
      - "8006:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zencrm -d zencrm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - zen-crm-local
    restart: unless-stopped

volumes:
  zen_crm_db_data:
  zen_crm_uploads:
  wuzapi_db_data:

networks:
  zen-crm-local:
